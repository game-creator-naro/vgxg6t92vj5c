    if (isSelf) {

      // 事実は変わらないため、ready を送らない判断はここで確定させる
      if (selfErrorCount < MAX_SELF_ERROR_COUNT) {
        selfErrorCount += 1;
      }
      if (reportedErrorCount >= MAX_REPORTED_ERRORS) {
        return;
      }
      reportedErrorCount += 1;
    } else {
      if (foreignReportCount >= MAX_FOREIGN_REPORTS) {
        return;
      }
      foreignReportCount += 1;
    }
    var payload = {
      kind: "gamekit-error",
      versionId: diagVersionId,
      message: String(message === null || message === undefined ? "unknown error" : message),
      stack: stack ? String(stack) : undefined,
      // rtfree-2（D-045）: 親が自動修正を要求してよいかの材料。
      // selfOrigin=false → 自分のコード由来と確認できない（拡張由来の可能性）
      // afterReady=true  → gamekit-ready 送信後に起きた（= 起動には成功している）
      selfOrigin: isSelf,
      afterReady: readySent
    };
    if (!diagPort) {
      if (pendingErrors.length < MAX_PENDING_ERRORS) {
        pendingErrors.push(payload);
      }
      return;
    }
    sendPortMessage(payload);
  }

  function tryReportReady() {
    // rtfree-2（D-045 追補）: 自分由来のエラーを 1 件でも観測していたら ready は送らない。
    // 「起動時に真っ黒 → その後 ready」で自動修正が取りこぼされる後退を塞ぐ。
    // なおこの判定は ready 送信前だけに効く（送信後のエラーは readySent で先に return する）ため、
    // 「起動には成功したがプレイ中に落ちた」ゲームの ready は従来どおり有効。
    if (readySent || !diagPort || !readyFlag || selfErrorCount > 0) {
      return;
    }
    readySent = true;
    // selfErrorCount は上の条件により常に 0 だが、payload には明示的に載せる（追補 3・P1-1）。
    // 親・サーバーは「ready と一緒に運ばれてきた観測件数」だけを見れば良く、
    // gamekit-error の HTTP 報告が失われた／遅れて処理された場合でも判断が壊れない
    sendPortMessage({ kind: "gamekit-ready", versionId: diagVersionId, selfErrorCount: selfErrorCount });
  }

  // ==========================================================================
  // rtfree-3（D-067）: 公開タイトル（親 Play.tsx が gamekit-init に積む games.title）の反映。
  //
  // 自由記述モードには GameKit のようなタイトル画面の構造が無いため、「どの要素がタイトルか」は
  // 文書側が data-gcn-title 属性で宣言する契約にする（docs/freeform-design.md「bridge の仕様」）。
  // 反映はプッシュ型 — ゲームが先に開始オーバーレイを描いてから init が届く順序が普通に起こるため、
  // 受信時に既存 DOM を書き換える。描画順に依存しない。
  //
  // 置換は textContent 限定で innerHTML は使わない。公開タイトルはクリエイターの自由入力であり、
  // HTML として解釈させると生成ゲームの文書内へ任意マークアップを流し込めてしまう
  // （値をデータとしてのみ扱う原則。Play.tsx の toInlineScriptJson と同じ考え方）。
  //
  // 受信検証（文字列かつ trim 後が非空）は gamekit.js rt-10 / gamekit3d.js rt3d-3 と同じ形に揃える。
  // DOM 操作は fail-open: タイトル表示の失敗でゲーム進行や ready 送信を止めない。
  // ==========================================================================
  function applyPublicTitle(value) {
    if (typeof value !== "string") {
      return;
    }
    var title = value.trim();
    if (title === "") {
      return;
    }
    GCN.publicTitle = title;
    try {
      global.document.title = title;
    } catch (e) {}
    try {
      var nodes = global.document.querySelectorAll("[data-gcn-title]");
      for (var i = 0; i < nodes.length; i++) {
        nodes[i].textContent = title;
      }
    } catch (e) {}
  }

  // オペークオリジンでは event.origin が "null" になり送信元検証に使えないため、
  // MessageChannel の port を専有すること自体を認証代わりにする（gamekit.js と同じ考え方）。
  // compose.ts は正常形 HTML の <head> 直後へ注入し、stopImmediatePropagation で後続の
  // 生成ロジックへ同じイベント・port を渡さない。ただし malformed な要素順では先行 script を
  // 原理的に排除できないため、これは defense-in-depth であり権威的制御は Play.tsx 側が担う。
  global.addEventListener("message", function (event) {
    var data = event.data;
    if (!data || data.kind !== "gamekit-init") {
      return;
    }
    event.stopImmediatePropagation();
    diagVersionId = typeof data.versionId === "string" ? data.versionId : null;
    if (data.saveData !== undefined && data.saveData !== null && typeof data.saveData === "object") {
      GCN.saveData = data.saveData;
    }
    // rtfree-3（D-067）: port の有無に関係なく反映する（下の early return より前に置く）。
    // 公開タイトルの表示は診断チャネルとは独立した機能で、port が取れない環境でも出るべきもの
    applyPublicTitle(data.publicTitle);
    diagPort = (event.ports && event.ports[0]) || null;
    if (!diagPort) {
      return;
    }
    for (var i = 0; i < pendingErrors.length; i++) {
      pendingErrors[i].versionId = diagVersionId;
      sendPortMessage(pendingErrors[i]);
    }
    pendingErrors = [];
    // rtfree-2（D-045 追補 3・codex-review P1-2）: onInit は **ready より必ず前**に呼ぶ。
    // onInit はセーブ復元などゲームの初期化を行う場所であり、ここで throw する = 起動できていない。
    // 以前は init が「load + rAF 2 回」より後に届くと readyFlag が既に true のため、
    // tryReportReady() → onInit の順になり、onInit の例外が afterReady:true 扱いで報告され、
    // 親が唯一の自動修正を抑制していた（D-045 で塞いだはずの「起動時の同期例外」の別経路）。
    // 例外は reportError 経由で selfErrorCount を増やすので、下の tryReportReady が ready を見送る。
    if (typeof GCN.onInit === "function") {
      try {
        GCN.onInit(GCN.saveData);
      } catch (e) {
        reportError(e && e.message ? e.message : String(e), e && e.stack);
      }
    }
    // init が ready 条件（load + rAF 2 回）より後に届いた場合はここで即送信、
    // 先に届いていた場合は load ハンドラ側の tryReportReady が後から送る（順序両対応）
    tryReportReady();
  });

  global.addEventListener("error", function (event) {
    // rtfree-2（D-045）: filename のホワイトリスト判定。自分の文書 / 同一オリジンの素材だけが
    // 自動修正の候補になる（拡張注入スクリプトは filename が chrome-extension://… 等で弾かれる）
    reportError(event.message, event.error && event.error.stack, isOwnSourceUrl(event.filename));
  });
  global.addEventListener("unhandledrejection", function (event) {
    var reason = event.reason;
    var stack = reason && reason.stack;
    reportError(
      reason && reason.message ? reason.message : String(reason),
      stack,
      stackMentionsOwnSource(stack)
    );
  });

  // ready 自動送信: load イベントの後、requestAnimationFrame を 2 回挟んでからフラグを立てる
  // （1 回だと最初の描画が済む前に ready を送ってしまい得るため。ゲート A の headless 検証が
  // 最初のスクリーンショットを撮る前に初期描画が済んでいることを期待するため 2 回待つ）。
  // rtfree-2（D-045 追補）: フラグが立っても、それまでに自分由来のエラーを観測していれば
  // tryReportReady が送信を見送る（= ready は「読み込み完了」ではなく「起動できた」の合図）。
  global.addEventListener("load", function () {
    global.requestAnimationFrame(function () {
      global.requestAnimationFrame(function () {
        readyFlag = true;
        tryReportReady();
      });
    });
  });

  // 送信抑制（ベストエフォートの UX 最適化）: GameKit と違い呼び出し頻度を生成コード側が
  // 握るため、善意のゲームループ内から毎フレーム呼ばれた場合の MessagePort 連投を減らす。
  // ただし bridge は未信頼のゲームコードと同一レルムにあり原理的に回避可能なので、これは
  // セキュリティ境界ではない。D1 POST の権威的な入力・レート・帯域制御は、信頼済み親ページの
  // Play.tsx が全ランタイム共通で行う（games/runtime/gamekit.js rt-9 の抑制も同じ位置づけ）。
  // bridge 自身は「先頭即時 + 2 秒クールダウン + 末尾フラッシュ」に抑制する。
  // クールダウン中の合成則はチャネルごとに異なる: サーバーはスコアを「受信した値のベスト」で
  // 保持するため、score は最大値を残す（100 → 0 と続いても 100 を失わない）。save は最新値が正。
  var THROTTLE_MS = 2000;
  var TEARDOWN_WINDOW_MS = 2000;
  // teardown 窓内の即時フラッシュ回数上限（チャネル別）。score は本文が数百バイトなので余裕を
  // 持たせ、save は最大 4KB 強 × keepalive の合計 in-flight 64KiB 制限（Fetch 仕様）を圧迫しない
  // よう 3 回に絞る（3 × 4KB ≒ 12KB。codex-review 反復 6 P2。現実のゲームの teardown 書き込みは
  // 1〜2 回であり実質失わない）
  var TEARDOWN_SCORE_FLUSH_BUDGET = 10;
  var TEARDOWN_SAVE_FLUSH_BUDGET = 3;
  // 通常の compose 出力では bridge を生成コードより前へ注入するため、この時点の Date.now /
  // setTimeout を閉じ込め、後からの偶発的な monkey-patch の影響を減らす（反復 6 P1）。ただし
  // 不正な HTML 配置等で先行 script が存在し得る以上、未汚染を権威性の根拠にはしない。
  var nativeDateNow = Date.now;
  var nativeSetTimeout = global.setTimeout.bind(global);
  function makeThrottledSender(send, coalesce, teardownBudgetMax) {
    var cooldown = false;
    var pending = null;
    function trigger(value) {
      cooldown = true;
      send(value);
      nativeSetTimeout(function () {
        cooldown = false;
        if (pending !== null) {
          var next = pending;
          pending = null;
          trigger(next);
        }
      }, THROTTLE_MS);
    }
    // teardown 用の即時フラッシュ窓。trusted なライフサイクルイベントを bridge のリスナーが
    // 観測したときだけ「時間窓 + 回数上限」が付与され、窓内のクールダウン中 submit は即時
    // フラッシュされる。これにより「ゲーム側の pagehide ハンドラが bridge のフラッシュより後に
    // GCN.save/score を呼ぶ」順序でも、teardown 中に同一チャネルへ複数回書く正当なゲーム
    // （pagehide リスナー 2 つ等。codex-review 反復 5 P1）でも最終値を取りこぼさない。
    // document.visibilityState は Object.defineProperty で偽装できる（反復 4 P1）ため判定に
    // 使わない — 窓は trusted イベント由来のみで、合成イベント・プロパティ偽装では開かない。
    // 乱用の上限は「実イベント 1 回あたり teardownBudgetMax 回・TEARDOWN_WINDOW_MS 以内」。
    // 上限超過後の書き込みは pending に合成されるだけになる（現実のゲームの teardown 書き込みは
    // 1〜2 回であり実質失わない）
    var teardownWindowUntil = 0;
    var teardownFlushBudget = 0;
    function submit(value) {
      if (cooldown) {
        pending = pending === null ? value : coalesce(pending, value);
        if (teardownFlushBudget > 0 && nativeDateNow() < teardownWindowUntil) {
          teardownFlushBudget--;
          submit.flush();
        }
        return;
      }
      trigger(value);
    }
    // ページ破棄時の取りこぼし防止: クールダウン待ちの未送信値を即時送信する
    // （タイマーはフレーム破棄で消えるため、待っていると親に届かない）
    submit.flush = function () {
      if (pending !== null) {
        var next = pending;
        pending = null;
        send(next);
      }
    };
    submit.armTeardownFlush = function () {
      teardownWindowUntil = nativeDateNow() + TEARDOWN_WINDOW_MS;
      teardownFlushBudget = teardownBudgetMax;
    };
    submit.disarmTeardownFlush = function () {
      teardownWindowUntil = 0;
      teardownFlushBudget = 0;
    };
    return submit;
  }
  var sendScoreThrottled = makeThrottledSender(function (score) {
    sendPortMessage({ kind: "gamekit-score", versionId: diagVersionId, score: score });
  }, function (a, b) {
    return a > b ? a : b;
  }, TEARDOWN_SCORE_FLUSH_BUDGET);
  var sendSaveThrottled = makeThrottledSender(function (json) {
    sendPortMessage({ kind: "gamekit-save", versionId: diagVersionId, data: json });
  }, function (a, b) {
    return b;
  }, TEARDOWN_SAVE_FLUSH_BUDGET);
  function flushPendingMessages() {
    sendScoreThrottled.flush();
    sendSaveThrottled.flush();
  }
  function armTeardownFlush() {
    sendScoreThrottled.armTeardownFlush();
    sendSaveThrottled.armTeardownFlush();
  }
  function disarmTeardownFlush() {
    sendScoreThrottled.disarmTeardownFlush();
    sendSaveThrottled.disarmTeardownFlush();
  }
  // pagehide は iOS Safari でも発火する。visibilitychange は保険（gamekit.js rt-9 と同じ）。
  // isTrusted ガード: ゲームコードが dispatchEvent(new Event("pagehide")) で合成イベントを
  // 連打してもフラッシュ（= スロットリングのバイパス経路）を踏めないようにする。
  // フラッシュ後に arm するのは、同じイベントディスパッチ内で後から動くゲーム側ハンドラの
  // GCN.save/score を即時送信するため（時間窓 + 回数上限。makeThrottledSender 参照）。
  // hidden 判定は偽装可能な visibilityState を見ず「pagehide = 破棄へ向かう」
  // 「visibilitychange = 表示状態が切り替わった」という trusted イベントの発生自体で扱う。
  global.addEventListener("pagehide", function (event) {
    if (event.isTrusted) {
      flushPendingMessages();
      armTeardownFlush();
    }
  });
  global.addEventListener("pageshow", function (event) {
    // bfcache から復帰したら通常のスロットリング動作に戻す（未使用の窓を破棄）
    if (event.isTrusted) {
      disarmTeardownFlush();
    }
  });
  global.addEventListener("visibilitychange", function (event) {
    // hidden への遷移か visible への復帰かを visibilityState で区別しない（偽装可能なため）。
    // どちら向きでも「未送信分をフラッシュして窓を付与」で統一する — visible 復帰時に短時間の
    // 即時送信を許すだけで、乱用には trusted イベントの実発生が必要なので有害でない
    if (event.isTrusted) {
      flushPendingMessages();
      armTeardownFlush();
    }
  });

  var GCN = {
    saveData: null,
    // rtfree-3（D-067）: 公開タイトル。gamekit-init 受信までは null（プレビューでは常に null）
    publicTitle: null,
    assets: assetsManifest,
    onInit: undefined,
    score: function (n) {
      if (typeof n !== "number" || !isFinite(n)) {
        reportError("GCN.score: 数値を渡してください");
        return;
      }
      sendScoreThrottled(Math.floor(n));
    },
    save: function (json) {
      if (typeof json !== "string") {
        reportError("GCN.save: JSON 文字列を渡してください（JSON.stringify 済みのもの）");
        return;
      }
      sendSaveThrottled(json);
    }
  };

  global.GCN = GCN;
})(window);
</script>

<script>
(function(){
var cv=document.getElementById("c"),ctx=cv.getContext("2d"),W,H,D;
var startButton=document.getElementById("start"),upEl=document.getElementById("upgrade"),
    overEl=document.getElementById("over"),upTitle=document.getElementById("upTitle"),
    upCards=document.getElementById("cards"),retryBtn=document.getElementById("retry"),
    scEl=document.getElementById("sc"),wvEl=document.getElementById("wv"),
    bstEl=document.getElementById("bst"),lfEl=document.getElementById("lf"),
    fsEl=document.getElementById("fs"),fbEl=document.getElementById("fb");

function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
  cv.width=W*D|0;cv.height=H*D|0;makeStars();
  if(cannon){cannon.x=clamp(cannon.x,36,W-36);cannon.tx=clamp(cannon.tx,36,W-36);}}
addEventListener("resize",resize);

function clamp(v,a,b){return v<a?a:(v>b?b:v);}
function cannonY(){return H-92;}

var score=0,best=0,wave=1,life=3;
var fireRate=4,power=1,streams=1,piercing=false,bulletSpd=15;
var fireTimer=0,spawnQueue=0,maxActive=3,spawnTimer=0.6;
var bullets=[],balls=[],ps=[],rings=[],floats=[],stars=[];
var cannon={x:180,tx:180,recoil:0};

// ---------- audio (WebAudio synth) ----------
var ac=null,AC=window.AudioContext||window.webkitAudioContext;
function unlockAudio(){
  try{
    if(!ac&&AC)ac=new AC();
    if(ac&&ac.state==="suspended"){var p=ac.resume();if(p&&p.catch)p.catch(function(){});}
  }catch(e){ac=null;}
}
function tone(f0,f1,dur,type,vol){
  if(!ac)return;
  try{
    var o=ac.createOscillator(),g=ac.createGain(),n=ac.currentTime;
    o.type=type;o.frequency.setValueAtTime(Math.max(f0,1),n);
    o.frequency.exponentialRampToValueAtTime(Math.max(f1,1),n+dur);
    g.gain.setValueAtTime(vol,n);g.gain.exponentialRampToValueAtTime(0.001,n+dur);
    o.connect(g);g.connect(ac.destination);o.start(n);o.stop(n+dur+0.03);
  }catch(e){}
}
function noiseBurst(dur,vol,lp){
  if(!ac)return;
  try{
    var n=ac.currentTime,len=Math.max(1,Math.floor(ac.sampleRate*dur)),
        buf=ac.createBuffer(1,len,ac.sampleRate),d=buf.getChannelData(0);
    for(var i=0;i<len;i++)d[i]=(Math.random()*2-1)*(1-i/len);
    var src=ac.createBufferSource();src.buffer=buf;
    var f=ac.createBiquadFilter();f.type="lowpass";
    f.frequency.setValueAtTime(lp,n);f.frequency.exponentialRampToValueAtTime(60,n+dur);
    var g=ac.createGain();
    g.gain.setValueAtTime(vol,n);g.gain.exponentialRampToValueAtTime(0.001,n+dur);
    src.connect(f);f.connect(g);g.connect(ac.destination);src.start(n);
  }catch(e){}
}

// ---------- HUD ----------
function updateHud(){
  scEl.textContent=score;
  wvEl.textContent=wave;
  bstEl.textContent="BEST "+Math.max(best,score);
  var h="";for(var i=0;i<life;i++)h+="❤️";
  lfEl.textContent=h||"💔";
}

// ---------- game objects ----------
function makeStars(){
  stars=[];
  var n=90;
  for(var i=0;i<n;i++)stars.push({x:Math.random()*W,y:Math.random()*H*0.7,r:0.6+Math.random()*1.6,ph:Math.random()*6.28});
}
function makeBall(hp,x,y){
  var r=Math.min(16+Math.sqrt(hp)*3.4,52);
  var hue=Math.max(0,195-hp*5.5);
  return{x:x,y:y,r:r,hp:hp,maxhp:hp,
    vx:(Math.random()<0.5?-1:1)*(0.4+Math.random()*0.8),vy:2.5,
    hue:hue,flash:0,dead:false};
}
function spawnBall(){
  var hp=3+wave*2+Math.floor(Math.random()*(3+wave*1.5));
  var x=60+Math.random()*(W-120);
  for(var i=0;i<5;i++){if(Math.abs(x-cannon.x)>110)break;x=60+Math.random()*(W-120);}
  balls.push(makeBall(hp,x,-60));
  spawnQueue--;
}
function spark(x,y,hue,sp){
  var a=Math.random()*6.28,v=(0.5+Math.random()*2.5)*sp;
  return{x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:1,h:hue,s:1.5+Math.random()*2.5};
}
function spawnExplosion(x,y,r,hue){
  var n=Math.min(10+Math.floor(r*0.7),40);
  for(var i=0;i<n;i++)ps.push(spark(x,y,hue+Math.random()*30-15,1+r/18));
  if(ps.length>320)ps.splice(0,ps.length-320);
}
function dust(b){
  for(var i=0;i<3;i++)ps.push({x:b.x+(Math.random()-0.5)*b.r,y:H-10,
    vx:(Math.random()-0.5)*1.2,vy:-(0.5+Math.random()),l:0.5,h:220,s:1.5});
}

// ---------- combat ----------
function shoot(){
  var cy=cannonY(),offs,i,x;
  if(streams===1)offs=[0];else if(streams===2)offs=[-10,10];else offs=[-19,0,19];
  for(i=0;i<offs.length;i++){
    x=clamp(cannon.x+offs[i],6,W-6);
    bullets.push({x:x,y:cy-70,vy:-bulletSpd,hits:[]});
  }
  cannon.recoil=5;muzzle=1;
  var now=performance.now();
  if(now-lastShot>60){lastShot=now;tone(680,180,0.07,"triangle",0.055);}
}
function hitSound(){
  var now=performance.now();
  if(now-lastHit>40){lastHit=now;tone(1300,900,0.045,"square",0.03);}
}
function killBall(b){
  score+=b.maxhp;GCN.score(score);updateHud();
  spawnExplosion(b.x,b.y,b.r,b.hue);
  rings.push({x:b.x,y:b.y,r:b.r*0.5,max:b.r*2.6,l:1,h:b.hue});
  trauma=Math.min(trauma+0.12+b.r/150,1);
  stop=Math.max(stop,b.r>34?4:2);
  noiseBurst(0.2+b.r/160,0.3,900);
  tone(150,50,0.2,"sine",0.26);
  if(b.r>=28){
    var h=Math.ceil(b.maxhp/2);
    for(var s=-1;s<=1;s+=2){
      var nb=makeBall(h,clamp(b.x+s*b.r*0.45,30,W-30),b.y);
      nb.vx=s*(0.8+Math.random()*0.8);nb.vy=-(3+Math.random()*1.5);
      balls.push(nb);
    }
  }
}
function hitCannon(b){
  life--;
  for(var q=0;q<balls.length;q++){
    var ob=balls[q],ox=ob.x-cannon.x,oy=ob.y-(cannonY()-30),od=Math.sqrt(ox*ox+oy*oy)||1;
    if(od<170){ob.vx+=ox/od*3.4;if(ob.vy>-4)ob.vy=-4;}
  }
  spawnExplosion(b.x,b.y,b.r,10);
  flash=1;trauma=Math.min(trauma+0.7,1);stop=6;
  noiseBurst(0.4,0.4,500);tone(160,40,0.3,"sawtooth",0.24);
  invincible=110;
  updateHud();
  if(life<=0)gameover();
}
function gameover(){
  state="over";
  trauma=1;flash=1;
  noiseBurst(0.6,0.45,400);
  playVoice("vo_over");
  if(score>best){best=score;GCN.save(JSON.stringify({best:best}));}
  GCN.score(score);
  fsEl.textContent=score;fbEl.textContent=best;
  overEl.hidden=false;
  updateHud();
}
function waveClear(){
  score+=wave*50;GCN.score(score);updateHud();
  state="upgrade";
  playVoice("vo_clear");
  tone(523,784,0.18,"triangle",0.2);
  setTimeout(function(){tone(784,1046,0.25,"triangle",0.18);},130);
  showUpgrade();
}

// ---------- update ----------
function updateBalls(){
  var cy=cannonY(),floorY=H-8;
  for(var i=balls.length-1;i>=0;i--){
    var b=balls[i];
    b.vy+=0.22;b.x+=b.vx;b.y+=b.vy;
    if(b.x<b.r+4){b.x=b.r+4;b.vx=Math.abs(b.vx);}
    if(b.x>W-b.r-4){b.x=W-b.r-4;b.vx=-Math.abs(b.vx);}
    if(b.y+b.r>floorY&&b.vy>0){
      b.y=floorY-b.r;b.vy=-(7.2+Math.min(wave*0.2,2.2));dust(b);
    }
    if(b.flash>0)b.flash-=0.08;
    if(invincible===0&&!b.dead){
      var hx=b.x-cannon.x,hy=b.y-(cy-34),hr=b.r*0.85+22;
      if(hx*hx+hy*hy<hr*hr){
        balls.splice(i,1);
        hitCannon(b);
      }
    }
  }
}
function updateBullets(){
  var i,j,b,bl,dx,dy,rr2;
  for(i=bullets.length-1;i>=0;i--){
    b=bullets[i];b.y+=b.vy;
    if(b.y<-40){bullets.splice(i,1);continue;}
    for(j=0;j<balls.length;j++){
      bl=balls[j];if(bl.dead)continue;
      dx=b.x-bl.x;dy=b.y-bl.y;rr2=bl.r+5;
      if(dx*dx+dy*dy<rr2*rr2){
        if(piercing&&b.hits.indexOf(bl)>=0)continue;
        bl.hp-=power;bl.flash=1;
        floats.push({x:b.x,y:bl.y-bl.r*0.4,txt:"-"+power,life:1});
        if(floats.length>36)floats.shift();
        for(var k=0;k<4;k++)ps.push(spark(b.x,b.y,bl.hue,1));
        hitSound();
        if(bl.hp<=0)bl.dead=true;
        if(piercing)b.hits.push(bl);else bullets.splice(i,1);
        break;
      }
    }
  }
  for(j=balls.length-1;j>=0;j--){
    if(balls[j].dead){var d=balls.splice(j,1)[0];killBall(d);}
  }
}
function updateFx(){
  var i;
  trauma=Math.max(trauma-0.03,0);
  flash=Math.max(flash-0.045,0);
  muzzle=Math.max(muzzle-0.14,0);
  if(banner.t>0)banner.t=Math.max(banner.t-0.011,0);
  for(i=ps.length-1;i>=0;i--){
    var p=ps[i];p.x+=p.vx;p.y+=p.vy;p.vy+=0.12;p.l-=0.025;
    if(p.l<=0)ps.splice(i,1);
  }
  for(i=rings.length-1;i>=0;i--){
    var r=rings[i];r.r+=(r.max-r.r)*0.2;r.l-=0.06;
    if(r.l<=0)rings.splice(i,1);
  }
  for(i=floats.length-1;i>=0;i--){
    var f=floats[i];f.y-=0.7;f.life-=0.045;
    if(f.life<=0)floats.splice(i,1);
  }
}
function update(dt){
  t++;
  if(state==="playing"){
    cannon.x+=(cannon.tx-cannon.x)*0.35;
    cannon.recoil=Math.max(0,cannon.recoil-0.5);
    fireTimer+=dt;
    var iv=1/fireRate;
    while(fireTimer>=iv){fireTimer-=iv;shoot();}
    if(spawnQueue>0&&balls.length<maxActive){
      spawnTimer-=dt;
      if(spawnTimer<=0){spawnTimer=0.65;spawnBall();}
    }
    updateBalls();
    updateBullets();
    if(invincible>0)invincible--;
    if(spawnQueue===0&&balls.length===0)waveClear();
  }
  updateFx();
}

// ---------- draw ----------
function rr(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}
function drawCover(img){
  var iw=img.width,ih=img.height;
  if(!iw||!ih)return false;
  var s=Math.max(W/iw,H/ih),w=iw*s,h=ih*s;
  ctx.drawImage(img,(W-w)/2,(H-h)/2,w,h);
  return true;
}
function drawBall(b){
  ctx.save();
  ctx.shadowColor="hsla("+b.hue+",90%,60%,0.9)";ctx.shadowBlur=16;
  var g=ctx.createRadialGradient(b.x-b.r*0.35,b.y-b.r*0.4,b.r*0.15,b.x,b.y,b.r);
  g.addColorStop(0,"hsl("+b.hue+",85%,70%)");
  g.addColorStop(0.7,"hsl("+b.hue+",80%,52%)");
  g.addColorStop(1,"hsl("+b.hue+",75%,36%)");
  ctx.fillStyle=g;
  ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,6.29);ctx.fill();
  ctx.shadowBlur=0;
  ctx.strokeStyle="rgba(10,10,30,0.5)";ctx.lineWidth=2.5;
  ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,6.29);ctx.stroke();
  if(b.flash>0){
    ctx.globalAlpha=Math.min(b.flash,1)*0.7;ctx.fillStyle="#fff";
    ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,6.29);ctx.fill();ctx.globalAlpha=1;
  }
  ctx.fillStyle="#fff";
  ctx.font="800 "+Math.floor(b.r*0.85)+"px system-ui,sans-serif";
  ctx.textAlign="center";ctx.textBaseline="middle";
  ctx.shadowColor="rgba(0,0,0,0.55)";ctx.shadowBlur=4;
  ctx.fillText(b.hp,b.x,b.y+1);
  ctx.restore();
}
function drawCannon(){
  var cy=cannonY();
  var blink=invincible>0&&((t>>2)%2===0);
  var gg=ctx.createRadialGradient(cannon.x,cy-6,0,cannon.x,cy-6,74);
  gg.addColorStop(0,"rgba(255,170,70,0.32)");
  gg.addColorStop(1,"rgba(255,170,70,0)");
  ctx.fillStyle=gg;
  ctx.beginPath();ctx.ellipse(cannon.x,cy-6,74,24,0,0,6.29);ctx.fill();
  ctx.save();
  if(blink)ctx.globalAlpha=0.35;
  if(cnImg&&cnReady){
    ctx.drawImage(cnImg,cannon.x-64,cy-112+cannon.recoil,128,128);
  }else{
    ctx.fillStyle="#46548a";rr(cannon.x-34,cy-16,68,18,8);ctx.fill();
    ctx.fillStyle="#66779f";rr(cannon.x-26,cy-28,52,14,7);ctx.fill();
    var rec=cannon.recoil;
    var g=ctx.createLinearGradient(cannon.x-15,0,cannon.x+15,0);
    g.addColorStop(0,"#ff8c2e");g.addColorStop(0.5,"#ffc570");g.addColorStop(1,"#ff8c2e");
    ctx.fillStyle=g;rr(cannon.x-14,cy-68+rec,28,46,11);ctx.fill();
    ctx.strokeStyle="rgba(50,25,0,0.65)";ctx.lineWidth=2.5;
    rr(cannon.x-14,cy-68+rec,28,46,11);ctx.stroke();
    ctx.fillStyle="#4d2c0d";rr(cannon.x-17,cy-74+rec,34,13,6);ctx.fill();
    ctx.fillStyle="#ffdf9f";rr(cannon.x-17,cy-74+rec,34,4,2);ctx.fill();
  }
  ctx.restore();
}
function draw(){
  ctx.setTransform(D,0,0,D,0,0);
  var i;
  // background
  if(bgImg&&bgReady&&drawCover(bgImg)){
    ctx.fillStyle="rgba(5,6,18,0.22)";ctx.fillRect(0,0,W,H);
  }else{
    var g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,"#141b3d");g.addColorStop(0.6,"#0a0e24");g.addColorStop(1,"#05060c");
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  }
  for(i=0;i<stars.length;i++){
    var s=stars[i];
    ctx.globalAlpha=0.3+0.3*Math.sin(t*0.04+s.ph);
    ctx.fillStyle="#cfe4ff";ctx.fillRect(s.x,s.y,s.r,s.r);
  }
  ctx.globalAlpha=1;
  var hg=ctx.createLinearGradient(0,H-170,0,H);
  hg.addColorStop(0,"rgba(80,120,255,0)");hg.addColorStop(1,"rgba(80,140,255,0.15)");
  ctx.fillStyle=hg;ctx.fillRect(0,H-170,W,170);

  ctx.save();
  if(trauma>0){
    var sh=trauma*trauma*16;
    ctx.translate((Math.random()-0.5)*sh,(Math.random()-0.5)*sh);
    ctx.rotate((Math.random()-0.5)*trauma*0.015);
  }
  // aim guide
  if(state==="playing"){
    ctx.globalAlpha=0.06+0.03*Math.sin(t*0.1);
    ctx.fillStyle="#9fd0ff";ctx.fillRect(cannon.x-1,0,2,cannonY()-70);
    ctx.globalAlpha=1;
  }
  for(i=0;i<balls.length;i++)drawBall(balls[i]);
  // bullets (additive)
  ctx.globalCompositeOperation="lighter";
  for(i=0;i<bullets.length;i++){
    var b=bullets[i];
    var bg=ctx.createLinearGradient(b.x,b.y,b.x,b.y+26);
    bg.addColorStop(0,"rgba(255,255,255,0.95)");bg.addColorStop(1,"rgba(255,170,60,0)");
    ctx.strokeStyle=bg;ctx.lineWidth=5.5;ctx.lineCap="round";
    ctx.beginPath();ctx.moveTo(b.x,b.y);ctx.lineTo(b.x,b.y+26);ctx.stroke();
    ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(b.x,b.y,3.5,0,6.29);ctx.fill();
  }
  if(muzzle>0){
    var cy=cannonY()-72;
    var mg=ctx.createRadialGradient(cannon.x,cy,0,cannon.x,cy,30*muzzle);
    mg.addColorStop(0,"rgba(255,240,180,"+(0.9*muzzle)+")");
    mg.addColorStop(1,"rgba(255,160,60,0)");
    ctx.fillStyle=mg;ctx.fillRect(cannon.x-32,cy-32,64,64);
  }
  for(i=0;i<ps.length;i++){
    var p=ps[i];
    ctx.globalAlpha=p.l*p.l;
    ctx.fillStyle="hsl("+p.h+",95%,65%)";
    ctx.beginPath();ctx.arc(p.x,p.y,p.s*p.l+0.4,0,6.29);ctx.fill();
  }
  ctx.globalAlpha=1;
  ctx.globalCompositeOperation="source-over";
  drawCannon();
  for(i=0;i<rings.length;i++){
    var r=rings[i];
    ctx.globalAlpha=Math.max(r.l,0);
    ctx.strokeStyle="hsl("+r.h+",95%,70%)";
    ctx.lineWidth=3*Math.max(r.l,0.1);
    ctx.beginPath();ctx.arc(r.x,r.y,r.r,0,6.29);ctx.stroke();
  }
  ctx.globalAlpha=1;
  for(i=0;i<floats.length;i++){
    var f=floats[i];
    ctx.globalAlpha=Math.max(f.life,0)*0.9;
    ctx.fillStyle="#fff";
    ctx.font="800 13px system-ui,sans-serif";
    ctx.textAlign="center";ctx.textBaseline="middle";
    ctx.fillText(f.txt,f.x,f.y);
  }
  ctx.globalAlpha=1;
  ctx.restore();

  if(flash>0){ctx.fillStyle="rgba(255,40,40,"+(flash*0.3)+")";ctx.fillRect(0,0,W,H);}
  if(banner.t>0){
    var ba=banner.t>0.75?(1-banner.t)*4:(banner.t<0.4?banner.t/0.4:1);
    var bk=1-banner.t,bs=0.75+0.25*Math.min(bk*4,1);
    ctx.save();
    ctx.globalAlpha=Math.max(0,Math.min(1,ba));
    ctx.translate(W/2,H*0.3);ctx.scale(bs,bs);
    ctx.font="900 46px system-ui,sans-serif";
    ctx.textAlign="center";ctx.textBaseline="middle";
    ctx.shadowColor="#4aa8ff";ctx.shadowBlur=34;
    ctx.fillStyle="#fff";
    ctx.fillText(banner.txt,0,0);
    ctx.shadowBlur=0;
    ctx.restore();
  }
  var vg=ctx.createRadialGradient(W/2,H*0.45,H*0.35,W/2,H*0.55,H*0.85);
  vg.addColorStop(0,"rgba(0,0,0,0)");vg.addColorStop(1,"rgba(0,0,0,0.42)");
  ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
}

// ---------- waves / upgrades ----------
function startWave(){
  bullets=[];rings=[];
  spawnQueue=2+wave*2;
  maxActive=Math.min(2+Math.ceil(wave/2),5);
  spawnTimer=0.9;fireTimer=0;
  spawnBall();
  banner.txt="WAVE "+wave;banner.t=1;
  updateHud();
}
var UPS=[
 {t:"🔥 連射速度 +25%",f:function(){fireRate*=1.25;}},
 {t:"💥 火力 +1",f:function(){power++;}},
 {t:"🔱 弾 +1列",f:function(){streams=Math.min(streams+1,3);},ok:function(){return streams<3;}},
 {t:"🎯 貫通弾になる",f:function(){piercing=true;},ok:function(){return !piercing;}},
 {t:"❤️ ライフ +1",f:function(){life=Math.min(life+1,5);},ok:function(){return life<5;}}
];
function showUpgrade(){
  upTitle.textContent="WAVE "+wave+" クリア!";
  upCards.innerHTML="";
  var pool=UPS.filter(function(u){return !u.ok||u.ok();});
  for(var i=pool.length-1;i>0;i--){
    var j=Math.floor(Math.random()*(i+1)),tmp=pool[i];pool[i]=pool[j];pool[j]=tmp;
  }
  var picked=pool.slice(0,Math.min(3,pool.length));
  picked.forEach(function(u){
    var b=document.createElement("button");
    b.type="button";b.className="card";b.textContent=u.t;
    var applied=false;
    var go=function(){
      if(applied)return;applied=true;
      unlockAudio();
      u.f();tone(520,880,0.15,"triangle",0.2);
      upEl.hidden=true;
      wave++;startWave();state="playing";updateHud();
    };
    b.addEventListener("click",go);
    b.addEventListener("pointerdown",function(e){e.preventDefault();go();});
    b.addEventListener("touchstart",function(e){e.preventDefault();go();},{passive:false});
    upCards.appendChild(b);
  });
  upEl.hidden=false;
}

// ---------- game flow ----------
function resetGame(){
  score=0;wave=1;life=3;
  fireRate=4;power=1;streams=1;piercing=false;bulletSpd=15;
  bullets=[];balls=[];ps=[];rings=[];floats=[];
  trauma=0;stop=0;flash=0;muzzle=0;invincible=0;
  cannon.x=cannon.tx=W/2;cannon.recoil=0;
  startWave();
  updateHud();
}
function startGame(){
  unlockAudio();startBgm();
  if(started)return;started=true;
  startButton.hidden=true;
  playVoice("vo_start");
  resetGame();state="playing";
}
function retryGame(){
  if(state!=="over")return;
  unlockAudio();startBgm();
  overEl.hidden=true;
  playVoice("vo_start");
  resetGame();state="playing";
}
startButton.addEventListener("click",startGame);
startButton.addEventListener("pointerdown",function(e){e.preventDefault();startGame();});
startButton.addEventListener("touchstart",function(e){e.preventDefault();startGame();},{passive:false});
retryBtn.addEventListener("click",retryGame);
retryBtn.addEventListener("pointerdown",function(e){e.preventDefault();retryGame();});
retryBtn.addEventListener("touchstart",function(e){e.preventDefault();retryGame();},{passive:false});

// ---------- input (pointer + touch, dual) ----------
var active=false,pointerId=null,touchId=null,grabOff=0;
function begin(kind,id,x,y){
  if(state!=="playing")return;
  if(active){
    if(kind==="pointer"&&pointerId===null)pointerId=id;
    else if(kind==="touch"&&touchId===null)touchId=id;
    return;
  }
  if(kind==="pointer")pointerId=id;else touchId=id;
  active=true;grabOff=cannon.tx-x;
}
function move(kind,id,x,y){
  if(state!=="playing"||!active)return;
  if(kind==="pointer"&&pointerId!==id)return;
  if(kind==="touch"&&touchId!==id)return;
  cannon.tx=clamp(x+grabOff,36,W-36);
}
function finish(){active=false;pointerId=null;touchId=null;}
function cancel(kind,id){
  if(kind==="pointer"&&pointerId===id)pointerId=null;
  if(kind==="touch"&&touchId===id)touchId=null;
  if(pointerId===null&&touchId===null)active=false;
}
function hasTouch(list,id){for(var i=0;i<list.length;i++)if(list[i].identifier===id)return true;return false;}
cv.addEventListener("pointerdown",function(e){
  e.preventDefault();if(e.isPrimary===false)return;
  if(active&&touchId===null&&pointerId!==null&&pointerId!==e.pointerId)finish();
  try{cv.setPointerCapture(e.pointerId);}catch(err){}
  begin("pointer",e.pointerId,e.clientX,e.clientY);
},{passive:false});
cv.addEventListener("pointermove",function(e){e.preventDefault();move("pointer",e.pointerId,e.clientX,e.clientY);},{passive:false});
cv.addEventListener("pointerup",function(e){if(pointerId===e.pointerId)finish();});
cv.addEventListener("pointercancel",function(e){cancel("pointer",e.pointerId);});
cv.addEventListener("touchstart",function(e){
  e.preventDefault();
  if(touchId!==null&&!hasTouch(e.touches,touchId))finish();
  var q=e.changedTouches[0];if(q)begin("touch",q.identifier,q.clientX,q.clientY);
},{passive:false});
cv.addEventListener("touchmove",function(e){
  e.preventDefault();
  for(var i=0;i<e.touches.length;i++){
    var q=e.touches[i];
    if(q.identifier===touchId){move("touch",q.identifier,q.clientX,q.clientY);break;}
  }
},{passive:false});
cv.addEventListener("touchend",function(e){
  e.preventDefault();
  for(var i=0;i<e.changedTouches.length;i++)if(e.changedTouches[i].identifier===touchId){finish();break;}
},{passive:false});
cv.addEventListener("touchcancel",function(e){
  for(var i=0;i<e.changedTouches.length;i++)cancel("touch",e.changedTouches[i].identifier);
},{passive:false});

// ---------- main loop ----------
var STEP=1000/60,acc=0,prevNow=0;
function frame(now){
  requestAnimationFrame(frame);
  if(!prevNow)prevNow=now;
  var dt=now-prevNow;prevNow=now;
  if(dt>250)dt=250;
  acc+=dt;
  var steps=0;
  while(acc>=STEP&&steps<5){
    acc-=STEP;steps++;
    if(stop>0)stop--;else update(STEP/1000);
  }
  if(steps>=5)acc=0;
  draw();
}
resize();
cannon.x=cannon.tx=W/2;
updateHud();
requestAnimationFrame(frame);
})();
</script>
